name: Release

# Unified npm release pipeline for @jiayunxie/aerial.
#
# Two publish channels, both routed through this single workflow because
# npm only allows ONE trusted publisher (OIDC binding) per package. The
# trusted publisher for @jiayunxie/aerial is bound to:
#   repo: Xiejiayun/aerial
#   file: .github/workflows/release.yml
# Therefore every `npm publish` for this package — stable AND nightly —
# must originate from this workflow file. There is no separate
# `nightly.yml`; the nightly path lives below as `mode=nightly`. See
# docs/release-runbook.md §2, §7, §8 for the operational story behind
# this constraint.
#
# Triggers and effective mode:
#   1. push tag matching v* — primary stable release path
#      (`git tag v0.1.1 && git push --tags`). The tag MUST equal
#      `v<package.json.version>` exactly; mismatched tags fail before
#      publish. Tag triggers are ALWAYS stable mode regardless of any
#      input value.
#   2. workflow_dispatch — manual path with a required `mode` choice
#      input:
#        - mode=stable (default): manual stable release escape hatch
#          when the tag path fails partway. Stable safety steps apply
#          (clean-stable-semver guard and idempotency precheck;
#          tag/version check applies on tag-triggered runs). Allowed
#          only from refs/heads/main.
#        - mode=nightly: publish a nightly pre-release through
#          scripts/publish-nightly.mjs. Allowed only from refs/heads/main.
#   3. schedule (future, added by commit γ) — cron-driven runs are
#      ALWAYS mode=nightly. The mode-detection step already routes
#      schedule events to nightly so γ is a one-line `on.schedule.cron`
#      addition with no logic change.
#
# Authentication: OIDC trusted publisher (npm "trusted publishers")
# only. No NPM_TOKEN secret is configured. OIDC's `job_workflow_ref`
# claim binds to this exact workflow file path; that is what npm
# verifies. Moving any publish step into a reusable workflow or a
# different file would change `job_workflow_ref` and break OIDC.
#
# Runtime split between test matrix and publish job:
#   - The `test` and `package-checks` jobs intentionally pin
#     `actions/setup-node@v4` with `node-version: "22"` so we keep
#     validating the Node 22 floor declared in package.json
#     (`engines.node: ">=22"`).
#   - The `publish` job uses `actions/setup-node@v6` with
#     `node-version: 24` and `package-manager-cache: false` because
#     npm trusted publishing requires npm CLI >= 11.5.1 and Node
#     >= 22.14, and that is the runtime npm's docs document for
#     trusted publishers (https://docs.npmjs.com/trusted-publishers/).
#     A pre-`npm ci` guard step inside the publish job verifies both
#     observed `node --version` and `npm --version` and hard-fails if
#     either is below its floor (Node 22.14.0 / npm 11.5.1). See
#     release-runbook §10 and §14.
#
# Anti-footgun: we always run the full multi-OS test matrix and the
# package/secret gate BEFORE the publish job, for BOTH modes. Publish
# is Ubuntu-only and depends on `test` and `package-checks` succeeding.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release channel: stable (default; escape-hatch) or nightly"
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly

# Default token permissions are minimal. The publish job widens to
# id-token:write locally for OIDC; no other job needs more than read.
permissions:
  contents: read

# Concurrency: serialize ALL release runs into a single global queue —
# stable AND nightly together — because both channels publish to the
# same npm package and must not race. We do NOT group by `${{ github.ref }}`,
# because the common "manual dispatch from refs/heads/main, then push
# refs/tags/v<version>" sequence would otherwise schedule two parallel
# publish jobs against the same version slot. The universal idempotency
# precheck inside the publish job will already make a re-run safe, but
# running them in parallel still races on `npm publish` and is best
# avoided. We do NOT cancel-in-progress — half-killing a publish is
# worse than queueing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node scripts/check-syntax.js

      - name: Run tests
        run: npm test

      - name: CLI help smoke
        run: node src/cli.js --help

      - name: CLI version smoke
        run: node src/cli.js --version

  package-checks:
    # Runs in parallel with `test`. Pack + secret scan are fast release-gate
    # checks; failing them must block publish independently of the test matrix.
    name: package & secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files and npm pack for secrets
        run: node scripts/verify-secrets.mjs

      - name: Verify npm pack contents
        run: node scripts/verify-package.mjs

  publish:
    name: publish to npm
    needs:
      - test
      - package-checks
    runs-on: ubuntu-latest
    # id-token:write is REQUIRED for OIDC trusted publisher; contents stays read.
    # Both stable and nightly publish steps reuse this same id-token claim.
    permissions:
      contents: read
      id-token: write
    # Job-level outputs are populated by the final `Emit publish outcome`
    # step, which reads whichever path actually executed (stable or
    # nightly) and writes unified values via bash. We deliberately do
    # NOT compose these outputs with GHA `&& ||` expressions over per-path
    # step outputs — empty strings and skipped-step outputs make those
    # expressions easy to misread.
    outputs:
      mode: ${{ steps.outcome.outputs.mode }}
      did_publish: ${{ steps.outcome.outputs.did_publish }}
      published_version: ${{ steps.outcome.outputs.published_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24 with npm registry (trusted publishing runtime)
        # npm trusted publishing requires npm CLI >= 11.5.1 and Node
        # >= 22.14. Node 24 satisfies both with margin and matches the
        # runtime npm's docs recommend for trusted publishers
        # (https://docs.npmjs.com/trusted-publishers/). The `test` and
        # `package-checks` jobs above stay on Node 22 to validate the
        # Node 22 floor declared in package.json engines.
        #
        # `package-manager-cache: false` disables setup-node's automatic
        # npm cache wiring per the trusted-publishers example; the
        # one-shot publish job does not benefit enough from the cache to
        # be worth the extra moving part.
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify Node and npm versions meet trusted publishing requirement
        # Hard gate before `npm ci` and any publish work. Trusted
        # publishing requires npm CLI >= 11.5.1 and Node >= 22.14;
        # setup-node@v6 + node-version: 24 should ship satisfying
        # versions of both, but a runner image regression or an
        # accidental node-version downgrade must fail the job here.
        # The guard prevents the old-runtime class of confusing
        # publish-auth failures, where sigstore provenance signing can
        # still complete before the registry PUT is rejected. See
        # docs/release-runbook.md §10 and §14.
        #
        # Implementation note: the comparison runs in Node rather than
        # shell so we get a real integer-tuple comparison instead of a
        # lexical sort (otherwise "9.x.y" would sort above "11.5.1").
        # Any non-digit suffix in a segment (e.g. an alpha tag) is
        # truncated conservatively to its leading digits via the
        # `num(s)` helper. Both Node and npm are checked; if either is
        # below its floor the job fails with an `::error::` annotation
        # for each, before exiting non-zero.
        run: |
          node --version
          npm --version
          node -e '
            const cp = require("node:child_process");
            const requiredNode = "22.14.0";
            const requiredNpm = "11.5.1";
            const npmV = cp.execSync("npm --version", { encoding: "utf8" }).trim();
            const nodeV = process.versions.node;
            console.log("observed node:", nodeV);
            console.log("observed npm:", npmV);
            const num = s => {
              const m = String(s).match(/^\d+/);
              return m ? parseInt(m[0], 10) : 0;
            };
            const cmp = (a, b) => {
              const pa = a.split(".").map(num);
              const pb = b.split(".").map(num);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
              }
              return 0;
            };
            let failed = false;
            if (cmp(nodeV, requiredNode) < 0) {
              console.error(`::error::Node ${nodeV} is below the required ${requiredNode} for npm trusted publishing. See docs/release-runbook.md §10 and §14.`);
              failed = true;
            }
            if (cmp(npmV, requiredNpm) < 0) {
              console.error(`::error::npm ${npmV} is below the required ${requiredNpm} for npm trusted publishing. See docs/release-runbook.md §10 and §14.`);
              failed = true;
            }
            if (failed) process.exit(1);
            console.log(`Node ${nodeV} and npm ${npmV} meet the trusted publishing requirement (Node >= ${requiredNode}, npm >= ${requiredNpm}).`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Determine effective release mode
        id: mode
        # Single source of truth for the rest of the job: every later
        # step's `if:` reads `steps.mode.outputs.mode`. Normalization
        # rules:
        #   - push (tag)        → mode is ALWAYS "stable". Tag-driven
        #                         releases are stable by definition.
        #   - workflow_dispatch → mode comes from the required `mode`
        #                         input. We do NOT silently coerce a
        #                         missing input to "stable"; the input
        #                         declaration is `required: true` with
        #                         `default: stable`, so every dispatch
        #                         carries an explicit value.
        #   - schedule          → mode is ALWAYS "nightly". The schedule
        #                         trigger itself is added by commit γ;
        #                         routing it to nightly here means γ is
        #                         a one-line addition (the cron entry)
        #                         with no mode-logic change.
        # Any other event type is unsupported and fails fast so an
        # accidentally-wired future trigger surfaces immediately.
        run: |
          EVENT="${{ github.event_name }}"
          case "${EVENT}" in
            push)
              MODE="stable"
              ;;
            workflow_dispatch)
              MODE="${{ github.event.inputs.mode }}"
              if [ -z "${MODE}" ]; then
                echo "::error::workflow_dispatch did not supply a mode input. Re-dispatch with mode set explicitly." >&2
                exit 1
              fi
              if [ "${MODE}" != "stable" ] && [ "${MODE}" != "nightly" ]; then
                echo "::error::Unsupported mode '${MODE}' (expected 'stable' or 'nightly')." >&2
                exit 1
              fi
              ;;
            schedule)
              MODE="nightly"
              ;;
            *)
              echo "::error::Unsupported event '${EVENT}' for release workflow. Only 'push' (tag), 'workflow_dispatch', and 'schedule' are allowed." >&2
              exit 1
              ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Effective release mode: ${MODE} (event=${EVENT})."

      - name: Validate dispatch context (main only)
        if: github.event_name == 'workflow_dispatch'
        # Both stable and nightly manual dispatches must originate from
        # refs/heads/main. The tag-trigger path does NOT go through this
        # check because the tag ref (refs/tags/v*) is itself the gate
        # for the stable path. Future schedule events also bypass this
        # check because their ref is the default branch by GHA contract.
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch (mode=${{ steps.mode.outputs.mode }}) is only allowed from refs/heads/main; got ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "Dispatch context OK: ref=${GITHUB_REF}, mode=${{ steps.mode.outputs.mode }}."

      # ---------------- stable path ----------------

      - name: (stable) Read package version
        id: pkg
        if: steps.mode.outputs.mode == 'stable'
        # Single-line read to avoid shell parsing edge cases.
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${PKG_VERSION}"

      - name: (stable) Validate package version is clean stable semver
        if: steps.mode.outputs.mode == 'stable'
        # Stable releases via release.yml MUST be a clean X.Y.Z; any
        # prerelease suffix (e.g. -nightly.YYYYMMDD.<sha7>, -rc.1, +build.X)
        # would otherwise be publishable to the `latest` dist-tag through
        # either the tag-trigger path (if someone pushed a matching
        # v<prerelease> tag) or the manual-dispatch path. Nightly versions
        # are computed in-memory by scripts/publish-nightly.mjs and
        # published under the @nightly dist-tag from the nightly path
        # below; they must never reach this stable-release path. See
        # release-runbook §3 ("stable version source") and §5/§6.
        run: |
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          if ! echo "${PKG_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '${PKG_VERSION}' is not a clean stable semver (X.Y.Z). Stable releases via release.yml may not include prerelease or build-metadata suffixes; those belong to the @nightly path. See docs/release-runbook.md §3, §5, §6." >&2
            exit 1
          fi
          echo "Stable version check OK: ${PKG_VERSION}"

      - name: (stable) Validate tag matches package version
        if: steps.mode.outputs.mode == 'stable' && github.event_name == 'push'
        # Tag must be exactly v<package.json.version>. Anything else is a typo
        # or someone pushing the wrong tag; fail hard before publishing.
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          EXPECTED="v${PKG_VERSION}"
          if [ "${TAG_REF}" != "${EXPECTED}" ]; then
            echo "::error::Tag '${TAG_REF}' does not match expected '${EXPECTED}' (package.json version=${PKG_VERSION})." >&2
            exit 1
          fi
          echo "Tag check OK: ${TAG_REF} == ${EXPECTED}."

      - name: (stable) Idempotency precheck
        id: idempotency
        if: steps.mode.outputs.mode == 'stable'
        # Tri-state check shared by tag-trigger AND manual-dispatch paths,
        # stable mode only. The common case after a manual dispatch is
        # the operator pushing v<version> to tag the commit, which
        # re-triggers this workflow against an already-published version.
        # Without idempotency that rerun would always E409 — see
        # release-runbook §6 + §11.
        #
        # `npm view` is classified into three outcomes:
        #   - succeeded with JSON                       → compare gitHead
        #   - failed with stderr/stdout matching E404 /
        #     "not found" / "No match"                  → version not on
        #                                                 registry; publish
        #   - any other failure (network, registry 5xx,
        #     auth/config error, parse error, etc.)     → hard fail; we
        #                                                 refuse to publish
        #                                                 against an unknown
        #                                                 registry state
        #
        # `should_publish` output:
        #   - "true"  : version not yet on the registry; do publish.
        #   - "false" : same gitHead is already published; skip publish
        #               but still run the post-publish smoke as verification.
        #   - script exits non-zero : a different commit owns this version
        #     slot, gitHead is missing, or `npm view` failed for a reason
        #     other than 404. Refuse to proceed.
        #
        # HEAD_SHA is taken from the local checkout (`git rev-parse HEAD`).
        # We deliberately do not use $GITHUB_SHA: it usually matches HEAD on
        # `push` and `workflow_dispatch`, but annotated-tag events and other
        # edge cases can diverge subtly, and the comparison against npm's
        # `gitHead` only makes sense against the same SHA the publish would
        # actually stamp into the manifest — which is the checked-out HEAD.
        #
        # Nightly mode does NOT run this step; its own skip/conflict
        # handling lives inside scripts/publish-nightly.mjs (strict
        # watermark classification + E409 reconcile loop).
        run: |
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          SPEC="@jiayunxie/aerial@${PKG_VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Idempotency precheck: spec=${SPEC} HEAD=${HEAD_SHA}"
          STDERR_FILE="${RUNNER_TEMP:-/tmp}/idempotency-view-stderr.txt"
          set +e
          VIEW_JSON="$(npm view "${SPEC}" --json 2>"${STDERR_FILE}")"
          VIEW_STATUS=$?
          VIEW_STDERR="$(cat "${STDERR_FILE}" 2>/dev/null || true)"
          set -e
          if [ "${VIEW_STATUS}" -ne 0 ]; then
            COMBINED="${VIEW_JSON} ${VIEW_STDERR}"
            if echo "${COMBINED}" | grep -Eqi 'E404|code E404|not found|No match'; then
              echo "Idempotency precheck: ${SPEC} not yet published (E404); will publish."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::npm view ${SPEC} failed with status ${VIEW_STATUS} (not E404). Refusing to publish against unknown registry state." >&2
            echo "::error::npm view stdout: ${VIEW_JSON}" >&2
            echo "::error::npm view stderr: ${VIEW_STDERR}" >&2
            exit 1
          fi
          if [ -z "${VIEW_JSON}" ]; then
            # Some npm versions print empty stdout for a 404 even with status 0.
            echo "Idempotency precheck: ${SPEC} not yet published (empty view); will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED_GIT_HEAD="$(node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((j&&typeof j.gitHead==="string")?j.gitHead:"")' <<< "${VIEW_JSON}")"
          if [ -z "${PUBLISHED_GIT_HEAD}" ]; then
            echo "::error::${SPEC} is already published but has no gitHead in its registry manifest; cannot verify idempotency. Bump package.json version." >&2
            exit 1
          fi
          if [ "${PUBLISHED_GIT_HEAD}" = "${HEAD_SHA}" ]; then
            echo "Idempotency precheck: ${SPEC} already published from this commit (${HEAD_SHA}); skipping npm publish and proceeding to smoke."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::${SPEC} is already published from a DIFFERENT commit (gitHead=${PUBLISHED_GIT_HEAD}, local HEAD=${HEAD_SHA}). Bump package.json version to publish anew." >&2
          exit 1

      - name: (stable) Publish to npm with provenance
        if: steps.mode.outputs.mode == 'stable' && steps.idempotency.outputs.should_publish == 'true'
        # OIDC via setup-node's id-token:write permission supplies publish
        # auth automatically. No NODE_AUTH_TOKEN env is set here: trusted
        # publisher is the only authenticated path. If OIDC breaks, the
        # package owner uses the emergency fallback procedure documented
        # in docs/release-runbook.md §14 (out-of-band, human-mediated),
        # not a repo-level secret.
        run: npm publish --access public --tag latest --provenance

      # ---------------- nightly path ----------------

      - name: (nightly) Compute, publish nightly (or skip)
        id: publish-nightly
        if: steps.mode.outputs.mode == 'nightly'
        # scripts/publish-nightly.mjs:
        #   - Reads `@latest` to compute base = bumpPatch(@latest.version);
        #     fails fast if `@latest` is unpublished.
        #   - Reads `@nightly` as the skip watermark with strict 5-state
        #     classification — only an explicit E404 or a successful view
        #     with a non-empty string `gitHead` are accepted; everything
        #     else throws and refuses to publish. See release-runbook §7.
        #   - When skip does not apply, writes the computed
        #     `<base>-nightly.YYYYMMDD.<sha7>` into package.json in-memory
        #     (NOT via `npm version`, so package-lock.json is untouched)
        #     and runs `npm publish --tag nightly --access public
        #     --provenance` via the publish job's OIDC token.
        #   - Restores package.json in a `finally` block.
        #   - Emits `did_publish` and `published_version` to $GITHUB_OUTPUT
        #     so the smoke step below can gate on them.
        #   - On any failure (unknown watermark state, E409 non-idempotent,
        #     publish error) the script's top-level catch emits
        #     `did_publish=false` and `process.exit(1)`, which fails this
        #     workflow step. A clean "no new commits since last nightly"
        #     skip also emits `did_publish=false` but exits 0; the smoke
        #     gate (`did_publish == 'true'`) handles both correctly.
        run: node scripts/publish-nightly.mjs

      # ---------------- unified outcome (must run before smoke) ----------------

      - name: Emit publish outcome
        id: outcome
        # Bash-driven normalization step. Reads whichever per-path step
        # outputs actually got set and writes unified job-level outputs
        # (`mode`, `did_publish`, `published_version`). We do this in
        # bash rather than GHA `&& ||` expressions because the latter
        # have subtle behavior around empty strings and skipped-step
        # outputs (where `steps.X.outputs.Y` evaluates to "" rather
        # than null), which can produce silent fallbacks. Bash with
        # explicit `[ "${VAR}" = "..." ]` comparisons is unambiguous.
        #
        # Semantics of `did_publish` (uniform across both modes):
        #   - "true"  : this workflow run actually wrote a new tarball
        #               to the registry. Stable mode: the idempotency
        #               precheck said publish, and the `npm publish`
        #               step ran. Nightly mode: the script's main path
        #               (or its E409 reconcile loop) succeeded.
        #   - "false" : this workflow run did NOT write to the registry.
        #               Stable mode: idempotency precheck found the same
        #               gitHead already published and skipped the publish
        #               step. Nightly mode: the @nightly watermark equals
        #               local HEAD so the script intentionally skipped.
        #               Stable smoke still runs (mode==stable gate);
        #               nightly smoke does not (did_publish==true gate).
        #   - ""      : something failed earlier in the path; the job is
        #               already red. Downstream consumers should ignore
        #               outputs from a failed job.
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          STABLE_PKG_VERSION="${{ steps.pkg.outputs.version }}"
          STABLE_SHOULD_PUBLISH="${{ steps.idempotency.outputs.should_publish }}"
          NIGHTLY_DID_PUBLISH="${{ steps.publish-nightly.outputs.did_publish }}"
          NIGHTLY_PUBLISHED_VERSION="${{ steps.publish-nightly.outputs.published_version }}"
          DID_PUBLISH=""
          PUBLISHED_VERSION=""
          if [ "${MODE}" = "nightly" ]; then
            DID_PUBLISH="${NIGHTLY_DID_PUBLISH}"
            PUBLISHED_VERSION="${NIGHTLY_PUBLISHED_VERSION}"
          elif [ "${MODE}" = "stable" ]; then
            PUBLISHED_VERSION="${STABLE_PKG_VERSION}"
            if [ "${STABLE_SHOULD_PUBLISH}" = "true" ]; then
              DID_PUBLISH="true"
            elif [ "${STABLE_SHOULD_PUBLISH}" = "false" ]; then
              DID_PUBLISH="false"
            else
              DID_PUBLISH=""
            fi
          else
            echo "::error::outcome step saw unexpected mode '${MODE}'; this should be unreachable because the determine-mode step fails on unknown modes." >&2
            exit 1
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "did_publish=${DID_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "published_version=${PUBLISHED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publish outcome: mode=${MODE} did_publish=${DID_PUBLISH} published_version=${PUBLISHED_VERSION}"

      # ---------------- smoke ----------------

      - name: (stable) Post-publish smoke (install exact version, with retry)
        if: steps.mode.outputs.mode == 'stable'
        # Install the freshly published exact version into a clean temp
        # dir and call the CLI. We MUST install by exact version, never
        # by a floating dist-tag like @latest, so a stale CDN/dist-tag
        # mirror cannot accidentally turn this into a no-op or test the
        # wrong build.
        #
        # Retry shape: an initial install attempt plus 4 retries with
        # 10/20/30/30s waits between them (~90s of waiting before the
        # final attempt). Just-published versions can take tens of
        # seconds to propagate to all registry edges, and we don't want
        # a transient 404 to red the workflow. The 35s window
        # (5/10/20) we used originally undershot observed CDN
        # propagation on multiple real runs; see docs/release-runbook.md
        # §10 ("Smoke install ETARGET after publish succeeds") and §11.
        #
        # Stable smoke is gated on `mode == 'stable'` only, NOT on
        # `did_publish`. Idempotency skip (did_publish=false) still
        # smokes the already-published version so a stale registry or
        # broken artifact surfaces on every rerun. Nightly smoke is
        # gated differently because a nightly skip means no new tarball
        # exists to verify.
        run: |
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          SPEC="@jiayunxie/aerial@${PKG_VERSION}"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          npm init -y >/dev/null
          DELAYS="10 20 30 30"
          INSTALLED=0
          ATTEMPT=0
          for DELAY in ${DELAYS}; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Smoke install attempt ${ATTEMPT}: npm install ${SPEC}"
            if npm install "${SPEC}"; then
              INSTALLED=1
              break
            fi
            echo "Smoke install attempt ${ATTEMPT} failed; sleeping ${DELAY}s before retry."
            sleep "${DELAY}"
          done
          if [ "${INSTALLED}" != "1" ]; then
            ATTEMPT=$((ATTEMPT + 1))
            echo "Smoke install final attempt ${ATTEMPT}: npm install ${SPEC}"
            npm install "${SPEC}"
          fi
          OUT="$(npx --no-install aerial --version)"
          echo "aerial --version output: ${OUT}"
          if [ "${OUT}" != "${PKG_VERSION}" ]; then
            echo "::error::Installed aerial reports '${OUT}', expected '${PKG_VERSION}'." >&2
            exit 1
          fi
          npx --no-install aerial --help >/dev/null
          echo "Smoke OK for ${SPEC}."

      - name: (nightly) Post-publish smoke (install exact version, with retry)
        if: steps.mode.outputs.mode == 'nightly' && steps.publish-nightly.outputs.did_publish == 'true'
        # Skip when the nightly script reported `did_publish=false` —
        # that means the @nightly skip watermark matched local HEAD and
        # no new tarball was published, so there is nothing new to
        # smoke. The previously-published @nightly was already smoked
        # in its original run.
        #
        # When we do smoke, install the EXACT computed nightly version,
        # never the floating @nightly dist-tag, so a stale registry
        # mirror cannot fake a green smoke.
        #
        # Retry budget mirrors the stable smoke: an initial install
        # attempt plus 4 retries with 10/20/30/30s waits between them
        # (~90s of waiting before the final attempt). The original
        # 5/10/20 window undershot observed CDN propagation; see
        # docs/release-runbook.md §10 and §11.
        run: |
          PKG_VERSION="${{ steps.publish-nightly.outputs.published_version }}"
          if [ -z "${PKG_VERSION}" ]; then
            echo "::error::nightly publish reported did_publish=true but did not emit published_version." >&2
            exit 1
          fi
          SPEC="@jiayunxie/aerial@${PKG_VERSION}"
          SMOKE_DIR="$(mktemp -d)"
          cd "${SMOKE_DIR}"
          npm init -y >/dev/null
          DELAYS="10 20 30 30"
          INSTALLED=0
          ATTEMPT=0
          for DELAY in ${DELAYS}; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Smoke install attempt ${ATTEMPT}: npm install ${SPEC}"
            if npm install "${SPEC}"; then
              INSTALLED=1
              break
            fi
            echo "Smoke install attempt ${ATTEMPT} failed; sleeping ${DELAY}s before retry."
            sleep "${DELAY}"
          done
          if [ "${INSTALLED}" != "1" ]; then
            ATTEMPT=$((ATTEMPT + 1))
            echo "Smoke install final attempt ${ATTEMPT}: npm install ${SPEC}"
            npm install "${SPEC}"
          fi
          OUT="$(npx --no-install aerial --version)"
          echo "aerial --version output: ${OUT}"
          if [ "${OUT}" != "${PKG_VERSION}" ]; then
            echo "::error::Installed aerial reports '${OUT}', expected '${PKG_VERSION}'." >&2
            exit 1
          fi
          npx --no-install aerial --help >/dev/null
          echo "Nightly smoke OK for ${SPEC}."
