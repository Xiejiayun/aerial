name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      # Don't let a Windows failure cancel Linux/macOS — we want full triplet
      # signal on every PR.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - "20.18.1"
          - "22"
    # ARM hosted capacity can leave macos-latest queued until cancellation.
    # Keep required check names stable and run the complete suite on macOS x64.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node scripts/check-syntax.js

      - name: Run tests
        run: npm test

      - name: Isolated native service lifecycle
        if: matrix.node == '22' && matrix.os != 'ubuntu-latest'
        run: node scripts/smoke-native-service.mjs

      - name: CLI help smoke
        run: node src/cli/index.js --help

      - name: CLI version smoke
        run: node src/cli/index.js --version

  package:
    # Runs in parallel with `test` (no `needs:`). pack + secret scan are fast
    # release-gate checks; failing them must block merge independently of
    # the multi-OS test matrix.
    name: package & secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files and npm pack for secrets
        run: node scripts/verify-secrets.mjs

      - name: Audit locked dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

      - name: Report authoritative npm release state
        run: npm view @jiayunxie/aerial versions dist-tags --json --registry=https://registry.npmjs.org

      - name: Verify npm pack contents
        run: node scripts/verify-package.mjs
